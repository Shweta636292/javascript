<!DOCTYPE html>
<html>
<head>
  <title>JavaScript Events</title>
</head>
<body>

  <!-- ================= WHAT IS AN EVENT ================= -->
  <!-- An event is an action like click, key press, mouse move -->

  <h2>1. Click Event</h2>
  <button onclick="clickEvent()">Click Me</button>

  <script>
    function clickEvent() {
      alert("Click event triggered");
    }
  </script>

  <!-- ================= EVENT TYPES ================= -->

  <!-- Mouse Event -->
  <h2>2. Mouse Event</h2>
  <button id="mouseBtn">Hover Me</button>

  <script>
    document.getElementById("mouseBtn").onmouseover = function () {
      console.log("Mouse over event");
    };
  </script>

  <!-- Keyboard Event -->
  <h2>3. Keyboard Event</h2>
  <input type="text" id="keyInput" placeholder="Press any key">

  <script>
    document.getElementById("keyInput").onkeydown = function () {
      console.log("Key pressed");
    };
  </script>

  <!-- Form Event -->
  <h2>4. Form Event</h2>
  <form id="form">
    <input type="text">
    <button type="submit">Submit</button>
  </form>

  <script>
    document.getElementById("form").onsubmit = function () {
      alert("Form submitted");
    };
  </script>

  <!-- ================= EVENT HANDLERS ================= -->
  <!-- Function that executes when an event occurs -->

  <h2>5. Event Handler using addEventListener</h2>
  <button id="handlerBtn">Click</button>

  <script>
    document.getElementById("handlerBtn").addEventListener("click", function () {
      alert("Handled using addEventListener");
    });
  </script>

  <!-- ================= EVENT OBJECT ================= -->
  <h2>6. Event Object</h2>
  <button id="eventObjBtn">Click Me</button>

  <script>
    document.getElementById("eventObjBtn").addEventListener("click", function (event) {
      console.log(event.type);    // click
      console.log(event.target);  // button element
    });
  </script>

  <!-- ================= PREVENT DEFAULT ================= -->
  <h2>7. preventDefault()</h2>
  <a href="https://google.com" id="link">Go to Google</a>

  <script>
    document.getElementById("link").addEventListener("click", function (event) {
      event.preventDefault(); // prevents link navigation
      alert("Default action prevented");
    });
  </script>

</body>
</html>
